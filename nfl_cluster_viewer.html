  "Kansas City Chiefs": "#E31837", "Las Vegas Raiders": "#000000", "Los Angeles Chargers": "#0080C6",
  "Los Angeles Rams": "#003594", "Miami Dolphins": "#008E97", "Minnesota Vikings": "#4F2683",
  "New England Patriots": "#002244", "New Orleans Saints": "#D3BC8D", "New York Giants": "#0B2265",
  "New York Jets": "#125740", "Philadelphia Eagles": "#004C54", "Pittsburgh Steelers": "#FFB612",
  "San Francisco 49ers": "#AA0000", "Seattle Seahawks": "#002244", "Tampa Bay Buccaneers": "#D50A0A",
  "Tennessee Titans": "#0C2340", "Washington Commanders": "#5A1414"
};

function App() {
  const teams = DATA.teams;
  const abbr = DATA.abbr;
  const [selected, setSelected] = useState("Minnesota Vikings");

  const sortedTeams = useMemo(
    () => [...teams].sort((a, b) => a.localeCompare(b)),
    [teams]
  );

  const bg = DATA.best_groups[selected];
  const accent = TEAM_COLORS[selected] || "#1F3864";

  // Group games by week
  const byWeek = useMemo(() => {
    const m = { 15: [], 16: [], 17: [] };
    bg.games.forEach((g) => m[g.week].push(g));
    return m;
  }, [bg]);

  // League-wide ranking
  const ranking = useMemo(() => {
    return [...teams]
      .map((t) => ({ team: t, count: DATA.best_groups[t].count, ti: DATA.best_groups[t].team_involved }))
      .sort((a, b) => b.count - a.count || b.ti - a.ti);
  }, [teams]);

  const rank = ranking.findIndex((r) => r.team === selected) + 1;

  return (
    <div style={{
      minHeight: "100vh",
      background: "radial-gradient(circle at 20% 10%, #16213e 0%, #0c0f1d 55%, #05060d 100%)",
      color: "#e8eaf0",
      fontFamily: "'DM Sans', system-ui, sans-serif",
      padding: "0",
    }}>
      <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

      {/* Header */}
      <div style={{
        padding: "32px 28px 22px",
        borderBottom: "1px solid rgba(255,255,255,0.08)",
        background: `linear-gradient(100deg, ${accent}22, transparent 60%)`,
      }}>
        <div style={{
          fontFamily: "'JetBrains Mono', monospace", fontSize: 12, letterSpacing: 3,
          textTransform: "uppercase", color: "#8a93b2", marginBottom: 8,
        }}>
          2026 NFL · Weeks 15–17 Cluster Finder
        </div>
        <h1 style={{
          fontFamily: "'Archivo Black', sans-serif", fontSize: 34, margin: 0,
          lineHeight: 1.0, letterSpacing: -0.5,
        }}>
          Late-Season Rivalry Clusters
        </h1>
        <p style={{ color: "#9aa3c0", maxWidth: 620, fontSize: 14.5, lineHeight: 1.5, marginTop: 12 }}>
          For each team, the tightest group of 4–6 teams that play each other the most across
          the Weeks 15–17 stretch run. Pick a team to see its best cluster.
        </p>
      </div>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 0 }}>
        {/* Sidebar: team picker */}
        <div style={{
          width: 230, flexShrink: 0, borderRight: "1px solid rgba(255,255,255,0.08)",
          maxHeight: "calc(100vh - 150px)", overflowY: "auto", padding: "10px 0",
        }}>
          {sortedTeams.map((t) => {
            const active = t === selected;
            const c = TEAM_COLORS[t];
            return (
              <button key={t} onClick={() => setSelected(t)} style={{
                display: "flex", alignItems: "center", gap: 10, width: "100%",
                padding: "9px 16px", background: active ? `${c}33` : "transparent",
                border: "none", borderLeft: active ? `3px solid ${c}` : "3px solid transparent",
                color: active ? "#fff" : "#aeb6d4", cursor: "pointer", textAlign: "left",
                fontSize: 13.5, fontWeight: active ? 700 : 500, transition: "all .15s",
                fontFamily: "'DM Sans', sans-serif",
              }}>
                <span style={{
                  fontFamily: "'JetBrains Mono', monospace", fontSize: 11, fontWeight: 700,
                  width: 34, height: 22, display: "flex", alignItems: "center",
                  justifyContent: "center", borderRadius: 4, background: c, color: "#fff",
                  flexShrink: 0, boxShadow: active ? `0 0 0 1px rgba(255,255,255,.3)` : "none",
                }}>{abbr[t]}</span>
                {t.split(" ").slice(-1)[0] === "Team" ? t : t.replace(/^(.*)\s(\S+)$/, "$2")}
              </button>
            );
          })}
        </div>

        {/* Main panel */}
        <div style={{ flex: 1, minWidth: 340, padding: "24px 28px" }}>
          {/* Team title card */}
          <div style={{
            display: "flex", alignItems: "center", gap: 16, marginBottom: 22,
            flexWrap: "wrap",

            <div style={{
              fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, fontSize: 20,

            <div>

                {selected}
              </div>
              <div style={{ color: "#8a93b2", fontSize: 13, marginTop: 5 }}>
                Connectivity rank: <span style={{ color: "#fff", fontWeight: 700 }}>#{rank}</span> of 32
              </div>
            </div>
          </div>

          {/* Stat tiles */}
          <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 26 }}>
            <StatTile label="Intra-group games" value={bg.count} accent={accent} big />
            <StatTile label="Involving this team" value={bg.team_involved} accent={accent} />
            <StatTile label="Teams in group" value={bg.group.length} accent={accent} />
          </div>

          {/* Group chips */}
          <SectionLabel>The Cluster</SectionLabel>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 28 }}>
            {bg.group.map((t) => {
              const isAnchor = t === selected;
              const c = TEAM_COLORS[t];
              return (
                <div key={t} style={{
                  display: "flex", alignItems: "center", gap: 8, padding: "7px 12px 7px 8px",
                  borderRadius: 999, background: isAnchor ? c : "rgba(255,255,255,0.06)",
                  border: `1px solid ${isAnchor ? c : "rgba(255,255,255,0.12)"}`,
                  fontWeight: isAnchor ? 700 : 500, fontSize: 13,
                  color: isAnchor ? "#fff" : "#d6dbf0",
                }}>
                  <span style={{
                    fontFamily: "'JetBrains Mono', monospace", fontSize: 10, fontWeight: 700,
                    padding: "2px 6px", borderRadius: 4, background: isAnchor ? "rgba(255,255,255,.25)" : c,
                    color: "#fff",
                  }}>{abbr[t]}</span>
                  {t}
                </div>
              );
            })}
          </div>

          {/* Week grid */}
          <SectionLabel>Games Among the Group · Weeks 15–17</SectionLabel>
          <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginTop: 12 }}>
            {[15, 16, 17].map((wk) => (
              <div key={wk} style={{
                flex: "1 1 200px", minWidth: 200, background: "rgba(255,255,255,0.035)",
                border: "1px solid rgba(255,255,255,0.08)", borderRadius: 14, overflow: "hidden",
              }}>
                <div style={{
                  padding: "10px 14px", background: "rgba(255,255,255,0.05)",
                  fontFamily: "'JetBrains Mono', monospace", fontSize: 12, letterSpacing: 1,
                  fontWeight: 700, color: "#aeb6d4", borderBottom: "1px solid rgba(255,255,255,0.06)",
                }}>WEEK {wk}</div>
                <div style={{ padding: 10, display: "flex", flexDirection: "column", gap: 8 }}>
                  {byWeek[wk].length === 0 && (
                    <div style={{ color: "#5b6488", fontSize: 12.5, padding: "8px 4px", fontStyle: "italic" }}>
                      No intra-group games
                    </div>
                  )}
                  {byWeek[wk].map((g, i) => {
                    const involved = g.home === selected || g.away === selected;
                    return (
                      <div key={i} style={{
                        padding: "9px 10px", borderRadius: 9,
                        background: involved ? `${accent}2e` : "rgba(255,255,255,0.04)",
                        border: `1px solid ${involved ? accent : "rgba(255,255,255,0.07)"}`,
                      }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, fontWeight: 600 }}>
                          <Tag c={TEAM_COLORS[g.away]} t={abbr[g.away]} />
                          <span style={{ color: "#7a83a6", fontSize: 11 }}>@</span>
                          <Tag c={TEAM_COLORS[g.home]} t={abbr[g.home]} />
                        </div>
                        <div style={{ color: "#8a93b2", fontSize: 11, marginTop: 5 }}>
                          {g.date} · {g.tv}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>

          {/* Note */}
          <div style={{
            marginTop: 26, padding: "12px 16px", borderRadius: 10,
            background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.07)",
            fontSize: 12.5, color: "#8a93b2", lineHeight: 1.5,
          }}>
            <strong style={{ color: "#c2c9e6" }}>How to read this:</strong> a "cluster" is the group of teams
            (anchored on the one you picked) that maximizes head-to-head games <em>within the group</em> over
            Weeks 15–17. Highlighted games directly involve {selected.split(" ").slice(-1)[0]}.
            The AFC North core tops the league at 7 games; most teams peak at 6.
          </div>
        </div>
      </div>
    </div>
  );
}

function StatTile({ label, value, accent, big }) {
  return (
    <div style={{
      padding: "16px 20px", borderRadius: 14, minWidth: big ? 130 : 110,
      background: big ? `linear-gradient(135deg, ${accent}, ${accent}aa)` : "rgba(255,255,255,0.05)",
      border: big ? "none" : "1px solid rgba(255,255,255,0.1)",
      boxShadow: big ? `0 10px 30px ${accent}55` : "none",
    }}>
      <div style={{
        fontFamily: "'Archivo Black', sans-serif", fontSize: big ? 42 : 32,
        lineHeight: 1, color: "#fff",
      }}>{value}</div>
      <div style={{
        fontSize: 11, letterSpacing: 0.5, color: big ? "rgba(255,255,255,0.85)" : "#9aa3c0",
        marginTop: 6, textTransform: "uppercase", fontWeight: 600,
      }}>{label}</div>
    </div>
  );
}

function SectionLabel({ children }) {
  return (
    <div style={{
      fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5, letterSpacing: 2,
      textTransform: "uppercase", color: "#7681a8", marginBottom: 6, fontWeight: 700,
    }}>{children}</div>
  );
}

function Tag({ c, t }) {
  return (
    <span style={{
      fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, fontWeight: 700,
      padding: "2px 6px", borderRadius: 4, background: c, color: "#fff",
    }}>{t}</span>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
